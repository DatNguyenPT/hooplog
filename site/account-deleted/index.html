<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Nothing here talks to any server and no script runs: no fonts, no images, no analytics. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; style-src 'self'; script-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../site.css" />
    <title>HoopLog: account deleted</title>
  </head>
  <body>
    <main>
      <p class="brand">HoopLog</p>
      <svg class="icon" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
        <circle cx="32" cy="32" r="30" />
        <path d="M19 33l9 9 17-19" />
      </svg>
      <h1>Account deleted</h1>
      <p>
        If you asked to delete your HoopLog account, it has been removed together with anything
        stored under it online.
      </p>
      <p>
        Workouts and shooting saved on your phone are still there until you erase them in the app,
        under Settings, Your data.
      </p>
    </main>
  </body>
</html>
